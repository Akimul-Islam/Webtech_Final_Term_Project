<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ==========================================================================
    PAGE 2: LOGIN PAGE (login.html)
    Project: Local Nest - Integrated Homestay & Local Experience Booking Platform
    Course: CSC 3215: Web Technologies (AIUB)
    Description:
    Provides user authentication with client-side validation and role-based
    redirection (RBAC) to Traveler, Host, Local Tour Guide, or Admin dashboards.
    Future PHP Note: Submit this form via POST to a PHP login controller that
    verifies password_verify($password, $row['password_hash']) and initializes
    $_SESSION['user_id'] and $_SESSION['role'].
    ==========================================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Localnest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page" data-page="login">

  <!-- ========================================================================
       1. MINIMAL AUTH HEADER
       ======================================================================== -->
  <header class="auth-header">
    <a href="index.html" class="brand-logo">
      <span class="brand-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5z"/>
          <path d="M9 21V13h6v8"/>
        </svg>
      </span>
      <span>localnest</span>
    </a>
    <a href="index.html" class="auth-header-link">Back to Home</a>
  </header>

  <!-- ========================================================================
       2. CENTERED LOGIN CARD
       ======================================================================== -->
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="loginHeading">
      <h1 id="loginHeading" class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to access your dashboard</p>

      <!-- Dynamic Status Banner (Matches Figma placeholder box & shows validation/login feedback) -->
      <div id="loginStatusBanner" class="status-banner" role="status" aria-live="polite">
        Error or success messages appear here.
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            class="form-control"
            placeholder="Enter your email address"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="auth-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="remember" />
            <span>Remember Me</span>
          </label>
          <a href="profile-settings.html" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="register.html">Register here</a>
      </p>

      <!-- Quick Demo Role Login Helper (Pre-fills credentials for testing RBAC) -->
      <div class="demo-role-pills">
        <div class="demo-role-pills-label">Quick Demo Role Login (Click to Auto-Fill)</div>
        <div class="demo-pills-row">
          <button type="button" class="demo-pill" data-demo-role="traveler">Traveler</button>
          <button type="button" class="demo-pill" data-demo-role="host">Host</button>
          <button type="button" class="demo-pill" data-demo-role="guide">Guide</button>
          <button type="button" class="demo-pill" data-demo-role="admin">Admin</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
