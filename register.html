<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account — Localnest</title>
  <link rel="stylesheet" href="css/register.css" />
</head>
<body class="auth-page" data-page="register">

  <header class="auth-header">
    <a href="index.html" class="brand-logo">
      <img src="photos/localnest logo.svg" alt="Localnest Logo" width="36" height="36" />
      <span>localnest</span>
    </a>
    <a href="index.html" class="auth-header-link">Back to Home</a>
  </header>

  <main class="auth-main">
    <section class="auth-card auth-card-wide" aria-labelledby="registerHeading">
      <h1 id="registerHeading" class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join as a Traveler, Host, or Local Tour Guide</p>

      <div id="registerStatusBanner" class="status-banner is-hidden" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regFullName" class="form-label">Full Name</label>
          <input
            type="text"
            id="regFullName"
            name="full_name"
            class="form-control"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address</label>
          <input
            type="email"
            id="regEmail"
            name="email"
            class="form-control"
            placeholder="Enter your email address"
            required
          />
        </div>

        <div class="form-group">
          <label for="regRole" class="form-label">Select Your Role</label>
          <select id="regRole" name="role" class="form-control" required>
            <option value="Traveler">Traveler (Guest)</option>
            <option value="Host">Host (Homestay Owner)</option>
            <option value="Guide">Local Tour Guide</option>
          </select>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="regPassword" class="form-label">Password</label>
            <input
              type="password"
              id="regPassword"
              name="password"
              class="form-control"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="regConfirmPassword"
              name="confirm_password"
              class="form-control"
              placeholder="Confirm password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4">
          Create Account
        </button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </section>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
