<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ==========================================================================
    PAGE 3: REGISTRATION PAGE (register.html)
    Project: Local Nest - Integrated Homestay & Local Experience Booking Platform
    Course: CSC 3215: Web Technologies (AIUB)
    Description:
    Role-based user registration page allowing new users to sign up as a
    Traveler (Guest), Host (Homestay Owner), or Local Tour Guide.
    Includes client-side form validation in js/main.js.
    Future PHP Note: Process POST data in PHP, validate uniqueness of email in
    the USER table, hash password with password_hash(), and insert record.
    ==========================================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account — Localnest</title>
  <link rel="stylesheet" href="css/register.css" />
</head>
<body class="auth-page" data-page="register">

  <!-- ========================================================================
       1. MINIMAL AUTH HEADER
       ======================================================================== -->
  <header class="auth-header">
    <a href="index.html" class="brand-logo">
      <span class="brand-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5z"/>
          <path d="M9 21V13h6v8"/>
        </svg>
      </span>
      <span>localnest</span>
    </a>
    <a href="index.html" class="auth-header-link">Back to Home</a>
  </header>

  <!-- ========================================================================
       2. CENTERED REGISTRATION CARD
       ======================================================================== -->
  <main class="auth-main">
    <section class="auth-card auth-card-wide" aria-labelledby="registerHeading">
      <h1 id="registerHeading" class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join as a Traveler, Host, or Local Tour Guide</p>

      <!-- Dynamic Validation Status Message Box (hidden until submit) -->
      <div id="registerStatusBanner" class="status-banner" style="display: none;" role="alert"></div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regFullName" class="form-label">Full Name</label>
          <input
            type="text"
            id="regFullName"
            name="full_name"
            class="form-control"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address</label>
          <input
            type="email"
            id="regEmail"
            name="email"
            class="form-control"
            placeholder="Enter your email address"
            required
          />
        </div>

        <!-- Role Selection Dropdown (Matches "Role selection expanded state.png") -->
        <div class="form-group">
          <label for="regRole" class="form-label">Select Your Role</label>
          <select id="regRole" name="role" class="form-control" required>
            <option value="Traveler">Traveler (Guest)</option>
            <option value="Host">Host (Homestay Owner)</option>
            <option value="Guide">Local Tour Guide</option>
          </select>
        </div>

        <!-- Password & Confirm Password Side-by-Side Row -->
        <div class="form-row-2">
          <div class="form-group">
            <label for="regPassword" class="form-label">Password</label>
            <input
              type="password"
              id="regPassword"
              name="password"
              class="form-control"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="regConfirmPassword"
              name="confirm_password"
              class="form-control"
              placeholder="Confirm password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 4px;">
          Create Account
        </button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </section>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
